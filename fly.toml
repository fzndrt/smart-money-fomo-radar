app = "smart-money-fomo-radar"
primary_region = "sin" # Singapore (Tercepat untuk RPC & latency Indonesia)

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1 # ⚠️ Agar bot tidak pernah mati / selalu aktif 24/7!

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
